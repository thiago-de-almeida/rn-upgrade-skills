name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  codex-skill-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync-codex-skill.py --check
